---
name: Release Publishing

"on":
  push:
    branches:
      - main
      # paths:
      #   - "current-version.txt"

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2  # Last two commits for version-change detection

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          pip install --constraint=.github/workflows/constraints.txt pip
          pip --version

      - name: Check if there is a parent commit
        id: check-parent-commit
        run: |
          echo "sha=$(git rev-parse --verify --quiet HEAD^)" >> $GITHUB_OUTPUT

      - name: Detect and tag new version
        id: check-version
        if: steps.check-parent-commit.outputs.sha
        run: |
          new_version=$(tr -d '[:space:]' < current-version.txt)
          old_version=$(git show HEAD^:current-version.txt 2>/dev/null | tr -d '[:space:]' || true)
          if [[ -z "$new_version" || "$new_version" == "$old_version" ]]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$new_version" -m "Released version $new_version"
          git push origin "$new_version"
          echo "tag=$new_version" >> "$GITHUB_OUTPUT"

      - name: Install Ansible
        run: |
          pip install --constraint=.github/workflows/constraints.txt ansible

      - name: Trigger a new import on Galaxy.
        run: ansible-galaxy role import --api-key ${{ secrets.GALAXY_TOKEN }} $(echo ${{ github.repository }} | cut -d/ -f1) $(echo ${{ github.repository }} | cut -d/ -f2)

      - name: Publish the release notes
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          publish: ${{ steps.check-version.outputs.tag != '' }}
          tag: ${{ steps.check-version.outputs.tag }}
          config-name: release_drafting_config.yml
          token: ${{ secrets.REPO_RELEASE_TOKEN }}
